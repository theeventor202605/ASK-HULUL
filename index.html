<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HULUL — Event Readiness &amp; Compliance Platform</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Ctext x='16' y='23' font-family='Arial,Helvetica,sans-serif' font-size='18' font-weight='800' fill='white' text-anchor='middle'%3EH%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body class="h-full">

  <!-- ===== Login screen ===== -->
  <div id="loginScreen" class="auth-shell">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="brand-mark">H</div>
        <div>
          <div class="brand-name">HULUL</div>
          <div class="brand-sub" data-i18n="tagline">Event Readiness &amp; Compliance Platform</div>
        </div>
      </div>
      <form id="loginForm" class="auth-form">
        <label class="field-label" data-i18n="email">Email</label>
        <input required type="email" id="loginEmail" class="field-input" placeholder="you@organisation.com" autocomplete="username" />
        <label class="field-label" data-i18n="password">Password</label>
        <input required type="password" id="loginPassword" class="field-input" placeholder="••••••••" autocomplete="current-password" />
        <div id="loginError" class="auth-error hidden"></div>
        <button type="submit" class="btn btn-primary w-full mt-2" data-i18n="signIn">Sign in</button>
      </form>
      <button id="langToggleLogin" class="lang-toggle-btn">EN / AR</button>
    </div>
  </div>

  <!-- ===== App shell ===== -->
  <div id="appShell" class="app-shell hidden">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-mark">H</div>
        <span class="brand-name">HULUL</span>
        <button id="sidebarCollapseBtn" class="sidebar-collapse-btn" aria-label="Collapse">‹</button>
      </div>
      <nav id="sidebarNav" class="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <button id="langToggleApp" class="lang-toggle-btn">EN / AR</button>
      </div>
    </aside>

    <div class="app-main">
      <header class="topbar">
        <button id="mobileNavBtn" class="icon-btn lg-hidden">☰</button>
        <div class="topbar-search">
          <input id="globalSearch" type="text" placeholder="Search events, findings, users…" data-i18n-placeholder="searchPlaceholder" />
        </div>
        <div class="topbar-actions">
          <img id="orgLogoImg" class="org-logo hidden" alt="Organization logo" />
          <button id="notifBtn" class="icon-btn" aria-label="Notifications">
            🔔<span id="notifBadge" class="notif-badge hidden">0</span>
          </button>
          <div id="userMenuBtn" class="user-chip">
            <div class="avatar" id="userAvatar">?</div>
            <div class="user-chip-text">
              <div id="userChipName" class="user-chip-name">—</div>
              <div id="userChipRole" class="user-chip-role">—</div>
            </div>
          </div>
        </div>
      </header>

      <main id="viewRoot" class="view-root"></main>
    </div>
  </div>

  <!-- ===== Shared overlays ===== -->
  <div id="toastRoot" class="toast-root"></div>
  <div id="modalRoot" class="modal-root hidden"></div>
  <div id="notifPanel" class="notif-panel hidden"></div>

  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/state.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/views/login.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/events.js"></script>
  <script src="js/views/eventDetail.js"></script>
  <script src="js/views/venues.js"></script>
  <script src="js/views/subEvents.js"></script>
  <script src="js/views/meetings.js"></script>
  <script src="js/views/disciplines.js"></script>
  <script src="js/views/checklistItems.js"></script>
  <script src="js/views/inspectorQualifications.js"></script>
  <script src="js/views/users.js"></script>
  <script src="js/views/organizations.js"></script>
  <script src="js/views/notifications.js"></script>
  <script src="js/views/config.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/router.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
